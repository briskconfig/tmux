set-option -g default-shell "/bin/bash"
set-option -g status-keys vi
set-option -g status-right "#(date +%%H:%%M -u)"
set-option -g set-titles
set-option -g status-style "fg=#ff4d00,bg=#0e1d35"
set-option -g message-style fg='#26c06d'
set-option -g default-terminal "xterm-256color"
set-option -g history-limit 3000000
set-option -g pane-border-status top
set-option -g pane-border-format " [ ###P #T ] "
set-window-option -g allow-rename off
set-option -g allow-rename off

unbind-key |
unbind-key -
unbind C-b

bind C-space send-prefix
bind y setw synchronize-panes on
bind C-s setw synchronize-panes off
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -i --clipboard --display :0"
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config loaded"
bind P command-prompt -I "" { select-pane -T "%%" }

unbind C-b
set-option -g prefix C-Space

bind-key | splitw -hc "#{pane_current_path}"
bind-key - splitw -vc "#{pane_current_path}"

bind-key j select-pane -D
bind-key h select-pane -L
bind-key k select-pane -U
bind-key l select-pane -R
bind-key C-h resize-pane -L 10
bind-key C-j resize-pane -D 10
bind-key C-k resize-pane -U 10
bind-key C-l resize-pane -R 10

